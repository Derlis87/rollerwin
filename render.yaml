services:
  - type: web
    name: rollerwin
    runtime: node
    plan: free
    buildCommand: mkdir -p db && npm install && npx prisma generate && npx prisma db push --skip-generate && npm run build:render && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public && cp -r db .next/standalone/db
    startCommand: cd .next/standalone && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./db/custom.db
